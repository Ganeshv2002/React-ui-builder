services:
  - type: web
    name: framewright
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    branch: editor-revamp-json-projects
    buildCommand: npm ci --include=dev && npm run build && npm ci --prefix server --include=dev && npm run build --prefix server
    preDeployCommand: node server/dist/src/db/migrate.js
    startCommand: node server/dist/src/index.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: framewright-db
          property: connectionString
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: framewright-db
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
