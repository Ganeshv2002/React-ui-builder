services:
  - type: web
    name: framewright
    runtime: node
    region: singapore
    plan: free
    branch: editor-revamp-json-projects
    buildCommand: npm ci --include=dev && npm run build && npm ci --prefix server --include=dev && npm run build --prefix server
    startCommand: node server/dist/src/db/migrate.js && node server/dist/src/index.js
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: framewright-db
          property: connectionString
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: MAIL_MODE
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: framewright-db
    region: singapore
    plan: free
    ipAllowList: []
