services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: framewright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: framewright
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framewright"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
